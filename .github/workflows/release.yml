name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión vive en src-tauri/tauri.conf.json y se publica con el tag vX.Y.Z.
      # Si el tag ya existe, el merge no puede publicar nada: hay que bumpear antes.
      - name: Guard release version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::El tag v$VERSION ya existe. Corré 'npm run release:bump -- <nueva-version>' antes de mergear."
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run test

      - name: Typecheck + Build frontend
        run: npm run build

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

  publish:
    needs: test
    strategy:
      fail-fast: false
      # Serializado a propósito: los dos jobs escriben el mismo latest.json en el
      # release. En paralelo se pisan y algún sistema queda sin entrada en el updater.
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GCAL_CLIENT_ID: ${{ secrets.VITE_GCAL_CLIENT_ID }}
          VITE_GCAL_CLIENT_SECRET: ${{ secrets.VITE_GCAL_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'AEON v__VERSION__'
          releaseBody: 'Descargá la versión para tu sistema operativo. La app no está firmada: Windows puede mostrar un aviso de SmartScreen y pedir confirmación la primera vez.'
          releaseDraft: false
          prerelease: false
          # Publica latest.json firmado, que es lo que consulta el updater in-app.
          includeUpdaterJson: true
          # En Windows el updater debe apuntar al instalador NSIS, no al MSI.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
